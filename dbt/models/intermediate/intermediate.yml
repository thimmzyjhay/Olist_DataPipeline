version: 2

models:
      - name: stg_orders
        columns:
          - name: order_id
            data_tests: [not_null]
          - name: customer_id
            data_tests: [not_null]
          - name: ingestion_timestamp
            data_tests: [not_null]

      - name: stg_customers
        columns:
          - name: customer_id
            data_tests: [not_null]
          - name: customer_unique_id
            data_tests: [not_null, unique]
          - name: ingestion_timestamp
            data_tests: [not_null]

      - name: stg_order_items
        columns:
      - name: order_id
        data_tests: [not_null]
      - name: order_item_id
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: seller_id
        data_tests: [not_null]
      - name: ingestion_timestamp
        data_tests: [not_null]

      - name: stg_order_payments
        columns:
          - name: order_id
            data_tests: [not_null]
          - name: payment_sequential
            data_tests: [not_null]
          - name: ingestion_timestamp
            data_tests: [not_null]

      - name: stg_order_reviews
        columns:
          - name: review_id
            data_tests: [not_null]
          - name: order_id
            data_tests: [not_null]
          - name: ingestion_timestamp
            data_tests: [not_null]

      - name: stg_products
        columns:
          - name: product_id
            data_tests: [not_null]
          - name: ingestion_timestamp
            data_tests: [not_null]

      - name: stg_sellers
        columns:
          - name: seller_id
            data_tests: [not_null]
          - name: ingestion_timestamp
            data_tests: [not_null]

      - name: stg_product_category_translation
        columns:
          - name: product_category_name
            data_tests: [not_null]